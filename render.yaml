services:
  # Backend API Service (Python FastAPI + PyTorch)
  - type: web
    name: mediatrust-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: PORT
        value: 8000

  # Frontend Static Site (React + Vite)
  - type: static
    name: mediatrust-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    rootDir: frontend
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
